site_name: CDA System - Documentación del API Gateway
site_description: Documentación del API Gateway y microservicios del sistema CDA
site_url: https://cda-system.github.io/api_gateway
repo_url: https://github.com/CDA-SYSTEM/api_gateway
repo_name: CDA-SYSTEM/api_gateway

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.footer
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

nav:
  - Inicio: index.md
  - Ejemplos: examples.md
  - API Backend:
    - Visión General: backend/index.md
    - Núcleo & Compartido:
      - Guards: backend/guards.md
      - Interceptors: backend/interceptors.md
      - Middleware: backend/middleware.md
    - Configuración: backend/configuration.md
    - Módulos: backend/modules.md
    - Controladores: backend/controllers.md
    - Servicios: backend/services.md
    - Entidades: backend/entities.md
    - Cómo Funciona: backend/how-it-works.md
  - Guías:
    - Despliegue: guides/deployment.md
    - Desarrollo Local: guides/local-development.md
    - Arquitectura de Red: guides/network-architecture.md
    - Solución de Problemas: guides/troubleshooting.md
  - Base de Datos: database/overview.md
  - Changelog: changelog.md
  - Servicios:
    - API Gateway: services/api-gateway.md
    - Auth Service: services/auth-service.md
    - Clients Service: services/clients-service.md
    - Vehicles Service: services/vehicles-service.md
    - Form Service: services/form-service.md
    - Storage Service: services/storage-service.md
    - Checklist Service: services/checklist-service.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Inicio: Home
            Ejemplos: Examples
            API Backend: Backend API
            Visión General: Overview
            Núcleo & Compartido: Core & Shared
            Guards: Guards
            Interceptors: Interceptors
            Middleware: Middleware
            Configuración: Configuration
            Módulos: Modules
            Controladores: Controllers
            Servicios: Services
            Entidades: Entities
            Cómo Funciona: How It Works
            Guías: Guides
            Despliegue: Deployment
            Desarrollo Local: Local Development
            Arquitectura de Red: Network Architecture
            Solución de Problemas: Troubleshooting
            Base de Datos: Database
            Changelog: Changelog
            API Gateway: API Gateway
            Auth Service: Auth Service
            Clients Service: Clients Service
            Vehicles Service: Vehicles Service
            Form Service: Form Service
            Storage Service: Storage Service
            Checklist Service: Checklist Service

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CDA-SYSTEM
      name: CDA System en GitHub
    - icon: fontawesome/solid/language
      link: https://cda-system.github.io/api_gateway/en/
      name: English version

copyright: Copyright &copy; 2026 Andres Iles, Emerson Iles, Audino Pantoja, Kevin Chanchi, Oscar Chavez — UniPutuamyo, Mocoa Putumayo
